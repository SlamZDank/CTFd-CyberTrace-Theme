<script>
  document.querySelector("footer a").innerText = "";
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Footer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        footer {
            font-family: 'Work Sans', sans-serif;
            background: #000;
            color: #fff;
            padding: 60px 40px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 20%, 
                rgba(255, 255, 255, 0.6) 50%, 
                rgba(255, 255, 255, 0.3) 80%, 
                transparent 100%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .footer-container {
            width: 1400px;
            max-width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        /* Left Side - Club Info */
        .club-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: contain;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo:hover {
            transform: translateY(-4px) scale(1.05);
        }

        .club-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
      
      .club-motto {
            font-family: 'Work Sans', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            font-style: thin;
            letter-spacing: 0.5px;
        }

        .socials {
            display: flex;
            gap: 20px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 50%;
        }

        .social-link:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link svg {
            position: relative;
            z-index: 1;
        }

        /* Right Side - Sponsors */
        .sponsors-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sponsors-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .sponsors-grid {
            display: grid;
            grid-template-columns: repeat(4, 160px);
            gap: 16px;
        }

        .sponsor-item {
            aspect-ratio: 2;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .sponsor-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .sponsor-item:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-8px) scale(1.05);
        }

        .sponsor-item:hover::before {
            opacity: 1;
        }

        .sponsor-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px;
            background: white;
            padding: 2px;
            position: relative;
            z-index: 1;
        }

        .footer-bottom {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        @media (max-width: 968px) {
            .footer-container {
                grid-template-columns: 1fr;
                gap: 60px;
            }

            .sponsors-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            footer {
                padding: 40px 24px 30px;
            }

            .logo {
                width: 64px;
                height: 64px;
            }

            .club-name {
                font-size: 24px;
            }

            .sponsors-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <footer>
        <div class="footer-container">
            <!-- Left Side: Club Info & Socials -->
            <div class="club-section">
                <div class="logo-container">
                    <img src="/files/031b9d860d27710591cde3ff3c2067d0/CybertraceClub.png" alt="CyberTrace Logo" class="logo">
                    <div>
                        <div class="club-name">CYBERTRACE</div>
                        <div class="club-motto">Security is a process, not a product.</div>
                    </div>
                </div>
                
                <div class="socials">
                    <a href="https://linktr.ee/CyberTracelinks" target="_blank" class="social-link" aria-label="Linktree">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13.511 5.853l4.005-4.117 2.325 2.381-4.201 4.005h5.909v3.305h-5.937l4.229 4.108-2.325 2.334-5.741-5.769-5.741 5.769-2.325-2.325 4.229-4.108H2V8.122h5.909L3.708 4.117l2.325-2.381 4.005 4.117V0h3.473v5.853zM10.038 16.16h3.473v7.842h-3.473V16.16z"/>
                        </svg>
                    </a>
                    <a href="https://www.instagram.com/cyber_trace_issatso/" target="_blank" class="social-link" aria-label="Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                    <a href="https://www.facebook.com/CyberTraceClub" target="_blank" class="social-link" aria-label="Facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Right Side: Sponsors -->
            <div class="sponsors-section">
                <div class="sponsors-title">Our Partners</div>
                <div class="sponsors-grid">
                    <a href="https://www.instagram.com/mizouphone.tn" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="/files/aea08cef9f40b0bb8a4397a064539fd7/Mizou.jpg" alt="Mizou" class="sponsor-logo">
                    </a>
                    <a href="https://www.instagram.com/creperie_tulipe/" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="/files/06d3ac20aa30972d8d47d90d53432ddd/Tulipe.jpg" alt="Tulipe" class="sponsor-logo">
                    </a>
                    <a href="https://www.zan9a.tn/en" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="/files/b8c102fd91feafb1a3b6389d33c4a757/zan9a-logo-text.png" alt="Zan9a" class="sponsor-logo">
                    </a>
                    <a href="https://www.instagram.com/piccolo.coffee.shop/" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="/files/07f5d66fb80439c8ed40cfb101a9d08f/Piccolo.jpg" alt="Piccolo" class="sponsor-logo">
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            © <span id="current-year"></span> CyberTrace. All rights reserved.
        </div>
    </footer>

    <script>
        // Update copyright year dynamically
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
